name: "Security Scan & AI Triage"
on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Run the Scanner
      - name: Semgrep Scan
        run: |
          pip install semgrep
          semgrep scan --json --output scan_results.json --config="p/default"
          
      # 2. Run AI Agent
      - name: AI Triage Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_triage.py scan_results.json